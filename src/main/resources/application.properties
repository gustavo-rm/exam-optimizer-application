spring.application.name=Dynamic Study Planner
spring.profiles.active=dev

# ---------------------------------------------------------------------------
# Seguranca
# ---------------------------------------------------------------------------

# Leitura dos cabecalhos X-Forwarded-*. DESLIGADA POR PADRAO (none), e a razao importa:
#
# Com "framework", o Spring registra o ForwardedHeaderFilter, que roda ANTES de qualquer filtro da
# aplicacao e REESCREVE request.getRemoteAddr() com o valor do X-Forwarded-For enviado pelo cliente.
# Isso anula por completo a protecao do ClientIpResolver: por mais que ele prefira o endereco da
# conexao, o endereco da conexao ja teria sido substituido pelo cabecalho. Medido na etapa 02b —
# com "framework", variar o cabecalho a cada requisicao burla o limite de taxa mesmo com
# api.trusted-proxies vazio.
#
# Trocar para "framework" SOMENTE junto com api.trusted-proxies preenchido e um proxy real na
# frente, situacao em que o cabecalho passa a ser confiavel. As tres chaves desta secao descrevem
# uma unica premissa de implantacao e devem ser ligadas juntas.
server.forward-headers-strategy=none

# Proxies cujo X-Forwarded-For pode ser acreditado, separados por virgula.
#
# VAZIO POR PADRAO, de proposito. Com a lista vazia, a identificacao do cliente usa apenas o
# endereco da conexao, que o chamador nao escolhe. Preencher isto sem ter um proxy real na frente
# reabre o achado S12: qualquer cliente forja o cabecalho, troca de balde a cada requisicao e anula
# o limite de taxa. Preencher com o endereco do balanceador, e nada alem dele.
# Exemplo: api.trusted-proxies=10.0.0.1,10.0.0.2
api.trusted-proxies=

# Exige HTTPS e emite HSTS. DESLIGADO POR PADRAO.
#
# Ligar SOMENTE junto com api.trusted-proxies preenchido: a decisao "esta requisicao veio por
# HTTPS?" depende do X-Forwarded-Proto, que so e confiavel vindo de um proxy conhecido. Ligar sem
# proxy quebra todo acesso local e nao acrescenta seguranca nenhuma.
#
# A terminacao TLS em si e responsabilidade de infraestrutura e nao pode ser feita por esta
# aplicacao. Ver docs/qualidade/02b-correcao-seguranca.md, item 0(b).
api.security.require-https=false
api.security.hsts-max-age-seconds=31536000

# Rate Limiting Configuration (Bucket4j)
# --- Estado compartilhado entre replicas (etapa 06b, achado E1) ---
#
# false (padrao): baldes do limite de taxa na memoria deste processo. CORRETO COM UMA REPLICA.
#   A partir da segunda, cada replica conta separado e o limite efetivo vira N x capacity — foi
#   isso que a etapa 06 demonstrou com dois processos reais (10 aceitos onde a politica diz 5).
#   A inicializacao registra um WARN dizendo isso, para que a escolha nunca seja silenciosa.
#
# true: baldes num Redis compartilhado. E o UNICO modo em que o limite vale para o conjunto.
#   Exige api.shared-state.redis.host/port apontando para um Redis alcancavel por todas as replicas.
api.shared-state.redis.enabled=false
api.shared-state.redis.host=localhost
api.shared-state.redis.port=6379
api.shared-state.redis.timeout-ms=2000

# Prazo de vida do registro de um trabalho assincrono, e teto de registros no modo local.
# Sem prazo, cada pedido deixaria ~36 KB de resultado guardado para sempre, e o armazenamento
# cresceria com o trafego ACUMULADO em vez de com o trafego em andamento.
api.jobs.ttl-minutes=60
api.jobs.max-records=10000

api.rate-limit.capacity=5
api.rate-limit.refill-tokens=5
api.rate-limit.refill-duration-minutes=1

# Observability & Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Metricas de thread do conector (achado E8).
#
# Sem esta chave o Micrometer publica apenas tomcat_sessions_* — seis series, todas zero neste
# servico, que nao usa sessao. As metricas que importam (tomcat_threads_busy, tomcat_threads_config_max)
# exigem o registro de MBeans. Na etapa 06 foi preciso liga-la a mao para medir que 30 pedidos em voo
# ocupavam 1 das 200 threads; a metrica que provaria isso em producao simplesmente nao existia.
server.tomcat.mbeanregistry.enabled=true

# Amostragem de rastreamento (achado E7).
#
# Estava em 1.0 — 100 % das requisicoes instrumentadas — sem NENHUM exportador no classpath: os
# spans eram criados e descartados. Cada requisicao pagava a instrumentacao por um dado que ninguem
# lia, e a 10x ou 100x de trafego isso e custo puro.
#
# O traceId continua no log (correlacao das linhas de uma requisicao funciona, e e o que se usa
# hoje). Quando um coletor existir, subir este valor e uma decisao consciente de custo; 10 % e o
# ponto de partida usual para trafego alto.
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}

# Compressao das respostas (achado E9).
#
# A resposta tem 36,3 KB e 99 % dela e o cronograma dia a dia — repetitivo por natureza. Medido:
# comprime para 2,5 KB, razao de 14,6x. Numa replica saturada isso e 21,4 GB/h de saida contra
# 1,5 GB/h. Egresso cresce linearmente com o trafego e nao tem teto.
#
# min-response-size evita gastar CPU comprimindo resposta de erro, que ja e pequena.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=2KB

# Tamanho do pool de threads que executa as otimizacoes.
#
# Deixar em 0 (ou ausente) faz a aplicacao ler o numero de nucleos da maquina em que ela roda.
# Ate a etapa 05b o valor era fixo em 8, com o comentario "Available core count" — que nao era
# verdade: o conteiner tem 4 nucleos, e a aplicacao registrava no log "optimizerTaskExecutor with
# 8 cores". Medido a 16 requisicoes simultaneas, medianas de 3 baterias alternadas:
#
#   pool = 2 (nucleos/2) ... 142 req/s
#   pool = 4 (nucleos) ..... 170 req/s   <- melhor, e o que 0 seleciona nesta maquina
#   pool = 6 ............... 155 req/s
#   pool = 8 (o valor fixo)  138 req/s
#
# So faz sentido informar um numero aqui para limitar o consumo de CPU de proposito — por exemplo,
# quando o processo divide a maquina com outro servico. Nesse caso, escreva o motivo junto.
optimizer.thread-pool-size=0

# --- Profundidade da fila e prazo, escolhidos JUNTOS (etapa 06b, achado E5) ---
#
# Ate a etapa 06 a fila tinha 50 vagas e o prazo era o padrao do Tomcat (30 s), sem nenhuma relacao
# entre os dois numeros. A aritmetica medida mostrava o problema:
#
#   drenar 50 pedidos pesados a 1,44 req/s ....... 35 s
#   prazo .......................................  30 s
#   => as ultimas ~7 vagas so produziam trabalho descartado: o cliente esperava 30 s, recebia 408,
#      e a otimizacao dele chegava a COMECAR, gastando CPU para uma conexao que ja tinha ido embora.
#
# Isso aparecia mesmo em carga igual a capacidade nominal: com 54 pedidos simultaneos (4 + 50),
# 18 receberam 408.
#
# A fila agora e dimensionada para caber no prazo. Com 4 threads e ~2,8 s por pedido pesado, cada
# vaga custa 2,8/4 = 0,7 s de espera; uma vaga na posicao D espera D x 0,7 s e ainda precisa de
# 2,8 s para executar:
#
#   D x 0,7 + 2,8 <= 30   =>   D <= 38
#
# 32 deixa margem. Recusar cedo (503 com Retry-After) e melhor que aceitar trabalho que sera
# descartado: custa 0,2 s ao cliente em vez de 30 s, e nao gasta CPU.
optimizer.queue-capacity=32

# O prazo agora e uma decisao declarada, nao o padrao do conteiner. Quem mudar um dos dois numeros
# precisa refazer a conta acima.
spring.mvc.async.request-timeout=30s

# Quanto o cliente deve esperar antes de repetir, no cabecalho Retry-After das respostas 503.
api.overload.retry-after-seconds=30
