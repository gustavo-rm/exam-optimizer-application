spring.application.name=Dynamic Study Planner
spring.profiles.active=dev

# Security
server.forward-headers-strategy=framework

# Rate Limiting Configuration (Bucket4j)
api.rate-limit.capacity=5
api.rate-limit.refill-tokens=5
api.rate-limit.refill-duration-minutes=1

# Observability & Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0

# Available core count
optimizer.thread-pool-size=8
