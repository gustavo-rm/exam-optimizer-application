spring.application.name=Dynamic Study Planner
spring.profiles.active=dev

# Security - Safe Proxy Header Configuration
# 'native' relies on Tomcat's internal RemoteIpValve which is more secure than Spring's framework filter.
server.forward-headers-strategy=native
# STRICTLY validate upstream proxies. Only trust X-Forwarded-For if it comes from these private IPs (e.g. your LB/Gateway).
# The default regex trusts standard private IPv4 ranges (10/8, 192.168/16, 172.16/12, 127/8).
# In production, this should be narrowed down strictly to the actual LB/Gateway subnet!
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|169\\.254\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|172\\.1[6-9]{1}\\.\\d{1,3}\\.\\d{1,3}|172\\.2[0-9]{1}\\.\\d{1,3}\\.\\d{1,3}|172\\.3[0-1]{1}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1

# Rate Limiting Configuration (Bucket4j)
api.rate-limit.capacity=5
api.rate-limit.refill-tokens=5
api.rate-limit.refill-duration-minutes=1

# Observability & Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0

# Available core count
optimizer.thread-pool-size=8
