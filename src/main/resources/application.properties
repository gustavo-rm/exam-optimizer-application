spring.application.name=Dynamic Study Planner
spring.profiles.active=dev

# ---------------------------------------------------------------------------
# Seguranca
# ---------------------------------------------------------------------------

# Leitura dos cabecalhos X-Forwarded-*. DESLIGADA POR PADRAO (none), e a razao importa:
#
# Com "framework", o Spring registra o ForwardedHeaderFilter, que roda ANTES de qualquer filtro da
# aplicacao e REESCREVE request.getRemoteAddr() com o valor do X-Forwarded-For enviado pelo cliente.
# Isso anula por completo a protecao do ClientIpResolver: por mais que ele prefira o endereco da
# conexao, o endereco da conexao ja teria sido substituido pelo cabecalho. Medido na etapa 02b —
# com "framework", variar o cabecalho a cada requisicao burla o limite de taxa mesmo com
# api.trusted-proxies vazio.
#
# Trocar para "framework" SOMENTE junto com api.trusted-proxies preenchido e um proxy real na
# frente, situacao em que o cabecalho passa a ser confiavel. As tres chaves desta secao descrevem
# uma unica premissa de implantacao e devem ser ligadas juntas.
server.forward-headers-strategy=none

# Proxies cujo X-Forwarded-For pode ser acreditado, separados por virgula.
#
# VAZIO POR PADRAO, de proposito. Com a lista vazia, a identificacao do cliente usa apenas o
# endereco da conexao, que o chamador nao escolhe. Preencher isto sem ter um proxy real na frente
# reabre o achado S12: qualquer cliente forja o cabecalho, troca de balde a cada requisicao e anula
# o limite de taxa. Preencher com o endereco do balanceador, e nada alem dele.
# Exemplo: api.trusted-proxies=10.0.0.1,10.0.0.2
api.trusted-proxies=

# Exige HTTPS e emite HSTS. DESLIGADO POR PADRAO.
#
# Ligar SOMENTE junto com api.trusted-proxies preenchido: a decisao "esta requisicao veio por
# HTTPS?" depende do X-Forwarded-Proto, que so e confiavel vindo de um proxy conhecido. Ligar sem
# proxy quebra todo acesso local e nao acrescenta seguranca nenhuma.
#
# A terminacao TLS em si e responsabilidade de infraestrutura e nao pode ser feita por esta
# aplicacao. Ver docs/qualidade/02b-correcao-seguranca.md, item 0(b).
api.security.require-https=false
api.security.hsts-max-age-seconds=31536000

# Rate Limiting Configuration (Bucket4j)
api.rate-limit.capacity=5
api.rate-limit.refill-tokens=5
api.rate-limit.refill-duration-minutes=1

# Observability & Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.tracing.sampling.probability=1.0

# Tamanho do pool de threads que executa as otimizacoes.
#
# Deixar em 0 (ou ausente) faz a aplicacao ler o numero de nucleos da maquina em que ela roda.
# Ate a etapa 05b o valor era fixo em 8, com o comentario "Available core count" — que nao era
# verdade: o conteiner tem 4 nucleos, e a aplicacao registrava no log "optimizerTaskExecutor with
# 8 cores". Medido a 16 requisicoes simultaneas, medianas de 3 baterias alternadas:
#
#   pool = 2 (nucleos/2) ... 142 req/s
#   pool = 4 (nucleos) ..... 170 req/s   <- melhor, e o que 0 seleciona nesta maquina
#   pool = 6 ............... 155 req/s
#   pool = 8 (o valor fixo)  138 req/s
#
# So faz sentido informar um numero aqui para limitar o consumo de CPU de proposito — por exemplo,
# quando o processo divide a maquina com outro servico. Nesse caso, escreva o motivo junto.
optimizer.thread-pool-size=0
