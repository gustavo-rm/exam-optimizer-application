spring.application.name=Dynamic Study Planner
spring.profiles.active=dev

# ---------------------------------------------------------------------------
# Seguranca
# ---------------------------------------------------------------------------

# Leitura dos cabecalhos X-Forwarded-*. DESLIGADA POR PADRAO (none), e a razao importa:
#
# Com "framework", o Spring registra o ForwardedHeaderFilter, que REESCREVE o esquema e o endereco
# da requisicao com o que o X-Forwarded-* enviado pelo cliente disser. Enquanto nao houver um proxy
# real na frente, isso significa deixar o proprio chamador declarar que a requisicao dele veio por
# HTTPS — e e essa declaracao que api.security.require-https, abaixo, usa para decidir se recusa a
# requisicao em claro.
#
# Trocar para "framework" SOMENTE junto com um proxy real na frente, situacao em que o cabecalho
# passa a ser confiavel. As duas chaves descrevem uma unica premissa de implantacao e devem ser
# ligadas juntas.
#
# Ate EOA-4b havia aqui uma terceira chave, api.trusted-proxies, lida pelo resolvedor de endereco
# do cliente que alimentava o balde do limite de taxa. O filtro de limite saiu com o caminho de
# concurso, e nenhum endereco de cliente e lido hoje.
server.forward-headers-strategy=none

# Exige HTTPS e emite HSTS. DESLIGADO POR PADRAO.
#
# Ligar SOMENTE junto com api.trusted-proxies preenchido: a decisao "esta requisicao veio por
# HTTPS?" depende do X-Forwarded-Proto, que so e confiavel vindo de um proxy conhecido. Ligar sem
# proxy quebra todo acesso local e nao acrescenta seguranca nenhuma.
#
# A terminacao TLS em si e responsabilidade de infraestrutura e nao pode ser feita por esta
# aplicacao. Ver docs/qualidade/02b-correcao-seguranca.md, item 0(b).
api.security.require-https=false
api.security.hsts-max-age-seconds=31536000

# Observability & Actuator
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Metricas de thread do conector (achado E8).
#
# Sem esta chave o Micrometer publica apenas tomcat_sessions_* — seis series, todas zero neste
# servico, que nao usa sessao. As metricas que importam (tomcat_threads_busy, tomcat_threads_config_max)
# exigem o registro de MBeans. Na etapa 06 foi preciso liga-la a mao para medir que 30 pedidos em voo
# ocupavam 1 das 200 threads; a metrica que provaria isso em producao simplesmente nao existia.
server.tomcat.mbeanregistry.enabled=true

# Amostragem de rastreamento (achado E7).
#
# Estava em 1.0 — 100 % das requisicoes instrumentadas — sem NENHUM exportador no classpath: os
# spans eram criados e descartados. Cada requisicao pagava a instrumentacao por um dado que ninguem
# lia, e a 10x ou 100x de trafego isso e custo puro.
#
# O traceId continua no log (correlacao das linhas de uma requisicao funciona, e e o que se usa
# hoje). Quando um coletor existir, subir este valor e uma decisao consciente de custo; 10 % e o
# ponto de partida usual para trafego alto.
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}

# Compressao das respostas (achado E9).
#
# A resposta tem 36,3 KB e 99 % dela e o cronograma dia a dia — repetitivo por natureza. Medido:
# comprime para 2,5 KB, razao de 14,6x. Numa replica saturada isso e 21,4 GB/h de saida contra
# 1,5 GB/h. Egresso cresce linearmente com o trafego e nao tem teto.
#
# min-response-size evita gastar CPU comprimindo resposta de erro, que ja e pequena.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json
server.compression.min-response-size=2KB
