# Profile configuration for the greedy baseline scheduler (docs/BASELINE_CORE.md).
#
# This file is loaded ONLY when the baseline-core profile is active. Without the profile the
# application boots exactly as it did before the baseline module existed, and POST /plans has no
# handler at all.
#
# ---------------------------------------------------------------------------
# baseline.core.version
# ---------------------------------------------------------------------------
#
# Reported back to the platform as PlanResponse.metadata.coreVersion, which the platform stores on
# the generation job (plan_generation_request.core_version) as the attribution of which build
# produced a plan. It is one of the eight things the platform refuses a response over: null or
# blank raises CoreProtocolException there.
#
# @project.version@ is substituted by Maven at package time. Resource filtering for
# application*.properties is configured by spring-boot-starter-parent, with @ as the delimiter, so
# the value that ships is the real build version and not a string somebody kept in step by hand.
#
# THERE IS DELIBERATELY NO DEFAULT IN THE CODE. GreedyBaselineScheduler injects this property with
# no fallback, so a deployment that cannot say which build answered fails at startup instead of
# answering with an invented version.
baseline.core.version=@project.version@

# ---------------------------------------------------------------------------
# plan.engine.default
# ---------------------------------------------------------------------------
#
# Which engine answers POST /plans when the request does not name one in
# algorithmParams.engine. Registered ids: greedy-baseline (EOA-2), ga (EOA-5).
#
# The engine is chosen PER REQUEST because the two are conditions of one experiment: a claim that
# the genetic algorithm beats a competent heuristic is only measurable if both run against the same
# build, from the same request. This property only decides what happens when the caller expresses
# no preference.
#
# THERE IS DELIBERATELY NO DEFAULT IN THE CODE. PlanEngineSelector injects this with no fallback
# and refuses to start when the value names no registered engine, so a deployment cannot silently
# run a condition nobody chose.
#
# It stays on greedy-baseline: the platform is already calling this endpoint, and changing which
# algorithm answers an existing caller is a product decision, not a consequence of wiring the
# genetic algorithm up.
plan.engine.default=greedy-baseline

# ---------------------------------------------------------------------------
# plan.engine.ga.*
# ---------------------------------------------------------------------------
#
# The genetic engine's run parameters. Not read from algorithmParams: the platform does not send
# them today, and a request that could change the search budget would make two plans in the same
# experiment incomparable without that difference being visible anywhere in the stored result.
# algorithmParams carries the engine choice only.
#
# The values are the ones GaResultadoInalteradoTest exercises as a realistic mid-size run. They are
# a cost ceiling, not a tuned optimum: no study has been run on this path to say where the quality
# curve flattens, and claiming otherwise would be the same overreach the fitness weights are
# documented against.
plan.engine.ga.generations=60
plan.engine.ga.population-size=40

# ---------------------------------------------------------------------------
# plan.fitness.sinapse.daily-load-budget
# ---------------------------------------------------------------------------
#
# Whether the SINAPSE path's daily-load ceiling (dailyLoadBudget, 0.20) is part of its fitness.
#
# It exists as a switch rather than as a code branch so that "no load ceiling" is an executable,
# comparable experimental condition. Turning it off RENORMALISES the remaining two weights
# automatically — syllabusMastery 0.50 -> 0.625, retention 0.30 -> 0.375 — because leaving them
# summing to 0.80 would rescale every fitness value the system reports and make earlier runs
# incomparable. FitnessEvaluator refuses to start on a weight sum that is not 1, so the
# renormalisation is not optional.
#
# When to turn it off: when the measured rate at which the ceiling actually binds is near zero. A
# term that is active in the code and never constrains a plan is decorative, and the published
# fitness cannot tell it apart from a term that looked and found nothing wrong. The rate is
# reported per plan in fitness (objective.dailyLoadBudget.binding and .excess-ratio) and
# aggregated by DailyLoadBudgetBindingRateTest.
plan.fitness.sinapse.daily-load-budget=true

# ---------------------------------------------------------------------------
# plan.fitness.sinapse.importance-strategy
# ---------------------------------------------------------------------------
#
# Where the weight of ScoreGainObjective — 0.50, half the fitness — comes from. Registered ids:
#
#   goal-priority            (default) goals[].priority, propagated to the subject's topics
#   prerequisite-centrality            how many topics transitively depend on a topic (HARD edges)
#
# On the concurso product this input was the subject's value on the exam: questionCount x axis
# weight, external and objective. The SINAPSE domain has no such field, so the substitute changes
# what the dominant term MEANS. goal-priority is self-declared, which sits in tension with the
# platform's decision L1 (ADR 0012, "the student declares nothing"); prerequisite-centrality is
# objective and consistent with L1, but it is a hypothesis nothing has validated.
#
# Both are implemented so the second can be measured against the first. The default is the one whose
# meaning a product decision already endorsed.
#
# Overridable per request via algorithmParams.importance, so switching conditions needs no recompile
# and no redeploy. The strategy that ran is always echoed in fitness["importance-strategy"] — a
# recorded run is not reproducible without it.
#
# THERE IS DELIBERATELY NO DEFAULT IN THE CODE: a deployment that cannot say what importance means
# fails to start.
plan.fitness.sinapse.importance-strategy=goal-priority
