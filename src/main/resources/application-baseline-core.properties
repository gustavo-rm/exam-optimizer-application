# Profile configuration for the greedy baseline scheduler (docs/BASELINE_CORE.md).
#
# This file is loaded ONLY when the baseline-core profile is active. Without the profile the
# application boots exactly as it did before the baseline module existed, and POST /plans has no
# handler at all.
#
# ---------------------------------------------------------------------------
# baseline.core.version
# ---------------------------------------------------------------------------
#
# Reported back to the platform as PlanResponse.metadata.coreVersion, which the platform stores on
# the generation job (plan_generation_request.core_version) as the attribution of which build
# produced a plan. It is one of the eight things the platform refuses a response over: null or
# blank raises CoreProtocolException there.
#
# @project.version@ is substituted by Maven at package time. Resource filtering for
# application*.properties is configured by spring-boot-starter-parent, with @ as the delimiter, so
# the value that ships is the real build version and not a string somebody kept in step by hand.
#
# THERE IS DELIBERATELY NO DEFAULT IN THE CODE. GreedyBaselineScheduler injects this property with
# no fallback, so a deployment that cannot say which build answered fails at startup instead of
# answering with an invented version.
baseline.core.version=@project.version@
