# Habilita o registro automático de extensões declaradas em
# META-INF/services/org.junit.jupiter.api.extension.Extension.
#
# Hoje registra apenas RandomProviderIsolation, que restaura o estado estático global de
# RandomProvider depois de cada teste. Ver o Javadoc daquela classe para o motivo.
junit.jupiter.extensions.autodetection.enabled=true

# A suíte roda em sequência, de propósito. RandomProvider é um singleton estático mutável
# compartilhado por testes e benchmarks; habilitar paralelismo aqui faria dois testes disputarem o
# mesmo campo. Ver docs/qualidade/01b-correcao-testes.md, pendência P1.
junit.jupiter.execution.parallel.enabled=false
